<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Platform Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 32px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .header p {
      opacity: 0.9;
    }
    
    .content {
      padding: 32px;
    }
    
    .section {
      margin-bottom: 32px;
    }
    
    .section h2 {
      font-size: 18px;
      color: #111827;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e5e7eb;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }
    
    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-group small {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: #6b7280;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      user-select: none;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }
    
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
    }
    
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }
    
    .btn-secondary:hover {
      background: #d1d5db;
    }
    
    .status-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .status-message.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    
    .status-message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ Extension Settings</h1>
      <p>Configure your AI Platform browser extension</p>
    </div>
    
    <div class="content">
      <div class="status-message" id="statusMessage"></div>
      
      <div class="section">
        <h2>🔐 API Configuration</h2>
        
        <div class="form-group">
          <label for="supabaseUrl">Supabase URL</label>
          <input 
            type="text" 
            id="supabaseUrl" 
            placeholder="https://your-project.supabase.co"
          >
          <small>Your Supabase project URL</small>
        </div>
        
        <div class="form-group">
          <label for="apiKey">API Key (Anon/Public)</label>
          <input 
            type="password" 
            id="apiKey" 
            placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          >
          <small>Your Supabase anon key</small>
        </div>
      </div>
      
      <div class="section">
        <h2>🎨 Appearance</h2>
        
        <div class="form-group">
          <label for="sidebarPosition">Sidebar Position</label>
          <select id="sidebarPosition">
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="sidebarWidth">Sidebar Width (px)</label>
          <input 
            type="text" 
            id="sidebarWidth" 
            value="400"
            placeholder="400"
          >
        </div>
      </div>
      
      <div class="section">
        <h2>⌨️ Keyboard Shortcuts</h2>
        
        <div class="checkbox-group">
          <input type="checkbox" id="enableShortcuts" checked>
          <label for="enableShortcuts">Enable keyboard shortcuts (Ctrl+Shift+G)</label>
        </div>
      </div>
      
      <div class="section">
        <h2>🔔 Notifications</h2>
        
        <div class="checkbox-group">
          <input type="checkbox" id="enableNotifications" checked>
          <label for="enableNotifications">Show notifications for AI responses</label>
        </div>
      </div>
      
      <div class="section">
        <h2>🔒 Privacy</h2>
        
        <div class="checkbox-group">
          <input type="checkbox" id="saveHistory" checked>
          <label for="saveHistory">Save conversation history locally</label>
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="sendAnalytics">
          <label for="sendAnalytics">Send anonymous usage analytics</label>
        </div>
      </div>
      
      <div class="button-group">
        <button class="btn btn-secondary" id="resetBtn">Reset to Defaults</button>
        <button class="btn btn-primary" id="saveBtn">Save Settings</button>
      </div>
    </div>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
