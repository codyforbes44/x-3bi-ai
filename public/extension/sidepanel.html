<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #333;
      background: #111;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      max-width: 90%;
      word-wrap: break-word;
    }

    .message.user {
      background: #1a73e8;
      align-self: flex-end;
      margin-left: auto;
    }

    .message.assistant {
      background: #222;
      align-self: flex-start;
      border: 1px solid #333;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #888;
      padding: 32px;
      text-align: center;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      opacity: 0.5;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #333;
      background: #111;
    }

    .input-container {
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 60px;
      max-height: 120px;
    }

    textarea:focus {
      outline: none;
      border-color: #1a73e8;
    }

    button {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }

    button:hover:not(:disabled) {
      background: #1557b0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        AI Assistant
      </h1>
      <div class="subtitle">Powered by Grok</div>
    </div>

    <div id="messages" class="messages">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        <div>
          <div style="font-weight: 500; color: #fff; margin-bottom: 4px;">Start a conversation</div>
          <div>Ask me anything about this page or any topic</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-container">
        <textarea 
          id="input" 
          placeholder="Type your message..."
          rows="2"
        ></textarea>
        <button id="send">Send</button>
      </div>
      <div class="hint">Press Enter to send, Shift+Enter for new line</div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
