<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - 3BI.AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      opacity: 0.8;
    }
    
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #8b5cf6;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #a0a0a0;
      margin-bottom: 32px;
    }
    
    .retry-btn {
      display: inline-block;
      background: #8b5cf6;
      color: white;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    
    .retry-btn:hover {
      background: #7c3aed;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(139, 92, 246, 0.3);
    }
    
    .status {
      margin-top: 24px;
      font-size: 14px;
      color: #666;
    }
    
    .online {
      color: #10b981;
    }
    
    .offline {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 1l6 6m0 0l6-6M7 7l6 6M1 13l6-6m0 0l6 6" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="10" stroke-opacity="0.3"/>
    </svg>
    
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Don't worry, we'll automatically reconnect when you're back online.
    </p>
    
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
    
    <div class="status">
      Status: <span id="status" class="offline">Offline</span>
    </div>
  </div>
  
  <script>
    // Monitor network status
    function updateStatus() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.textContent = 'Online';
        status.className = 'online';
        // Auto-reload when back online
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      } else {
        status.textContent = 'Offline';
        status.className = 'offline';
      }
    }
    
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    
    // Check status periodically
    setInterval(updateStatus, 3000);
  </script>
</body>
</html>
